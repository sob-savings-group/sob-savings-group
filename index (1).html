// Optional real auth server (see Code_Auth.gs) — a small, SEPARATE Apps Script
// with its own spreadsheet, whose only job is checking PINs server-side, so

// financial data. Leave blank to keep using the (visible, weaker) ADMIN_PIN above.
const AUTH_SERVER_URL = "https://script.google.com/macros/s/AKfycbw2w0L7SLdbPcELQCYD7c2YZQSu6jZPeyjCrZJh7cSPhPDHZi4DKU-mHLRFgUs9Z9LNWA/exec";

// Optional one-way auto-backup (see Code_Backup.gs) — sends a safety-net
// snapshot to a separate Google Drive folder at most once per hour, in the
// background. This is NOT a live connection: nothing reads from it, the
// app never depends on it, and if it's unreachable the app just continues
// normally. Leave blank to skip this entirely.
const AUTO_BACKUP_URL = "https://script.google.com/macros/s/AKfycbzBLVzzdld7XfV0akpqzrwzOE2CwXHE8LQfiw89ZI5tKaecU_RJTPwh3f3IRrxpTE_e2g/exec";
const AUTO_BACKUP_KEY = "AUTO-SOB DATA BACKUP@2026";
const AUTO_BACKUP_MIN_INTERVAL_MS = 15 * 60 * 1000; // routine saves: at most every 15 minutes
let _lastAutoBackupAttempt = 0;

function sendAutoBackup(db) {
    _lastAutoBackupAttempt = Date.now();
    // Fire-and-forget: never awaited, never blocks saving, never surfaces
    // an error to the user — this is a pure background safety net.
    fetch(AUTO_BACKUP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ key: AUTO_BACKUP_KEY, action: "saveBackup", json: JSON.stringify(db) })
    }).catch(e => console.log("[auto-backup skipped — relay unreachable]", e));
}
function maybeAutoBackup(db) {
    if (!AUTO_BACKUP_URL) return;
    if (Date.now() - _lastAutoBackupAttempt < AUTO_BACKUP_MIN_INTERVAL_MS) return;
    sendAutoBackup(db);
}
// Bypasses the routine throttle entirely — used right after anything that
// would be genuinely painful to lose (loan issuance, repayments, voids,
// airtime fulfillment, restores), so at most the loss window for those
// specific events is however long the network takes, not up to 15 minutes.
function forceAutoBackup(db) {
    if (!AUTO_BACKUP_URL) return;
    sendAutoBackup(db);
}

async function checkPin(role, memberId, pin) {
    if (!AUTH_SERVER_URL) {
        // No real server configured — fall back to the local constant, which
        // is not truly secret since it's visible in this page's source.
        if (role === "admin") return { ok: pin === ADMIN_PIN, hasPin: true, viaServer: false };
        return { ok: false, hasPin: false, viaServer: false };
    }
    try {
        const res = await fetch(AUTH_SERVER_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ key: AUTH_SERVER_KEY, action: "checkPin", role, memberId, pin })
        });
        const data = await res.json();
        return Object.assign({}, data, { viaServer: true });
    } catch (e) {
        console.error("Auth server unreachable, falling back to local check.", e);
        if (role === "admin") return { ok: pin === ADMIN_PIN, hasPin: true, viaServer: false };
        return { ok: false, hasPin: false, viaServer: false };
    }
}
// Staff login: one PIN field, no role picker — whichever role's PIN matches
// determines access. Only works when the real auth server is configured,
// since role-splitting requires server-side storage of multiple PINs; the
// local ADMIN_PIN fallback only ever supports the single full-access role.
async function checkStaffPin(pin) {
    if (!AUTH_SERVER_URL) {
        return { ok: pin === ADMIN_PIN, matchedRole: pin === ADMIN_PIN ? "admin" : null, viaServer: false };
    }
    try {
        const res = await fetch(AUTH_SERVER_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ key: AUTH_SERVER_KEY, action: "checkStaffPin", pin })
        });
        const data = await res.json();
        return Object.assign({}, data, { viaServer: true });
    } catch (e) {
        console.error("Auth server unreachable, falling back to local admin-only check.", e);
        return { ok: pin === ADMIN_PIN, matchedRole: pin === ADMIN_PIN ? "admin" : null, viaServer: false };
    }
}
// Self-service PIN change — requires knowing the current correct PIN. Only
// works when the real auth server is configured, since the local fallback
// constant can't actually be updated from inside the running app.
async function changePin(role, oldPin, newPin) {
    if (!AUTH_SERVER_URL) return { ok: false, error: "No auth server configured — cannot change PIN from here." };
    try {
        const res = await fetch(AUTH_SERVER_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ key: AUTH_SERVER_KEY, action: "changePin", role, oldPin, newPin })
        });
        return await res.json();
    } catch (e) {
        return { ok: false, error: "Could not reach the auth server." };
    }
}

// Traccar SMS Gateway setup (this is the whole thing — no tunnel, no local
// network, no ngrok needed):
//   1. Admin installs "Traccar SMS Gateway" from the Play Store on their phone
//   2. Opens the app, taps Start — an API key/token is displayed on screen
//   3. Paste that token below as SMS_GATEWAY_KEY, and Admin's own number as
//      ADMIN_PHONE
// That's it. The URL below is Traccar's own public relay — it works over the
// phone's normal mobile data or WiFi, reaching it from anywhere (including
// this web app), which is what makes this workable for 80+ members rather
// than requiring everyone on the same local network.
const SMS_GATEWAY_URL = "https://www.traccar.org/sms/";
const SMS_GATEWAY_KEY = ""; // paste the token shown in the Traccar app here
const ADMIN_PHONE = "";     // Admin's own phone number, e.g. "+256700000000"

const AIRTIME_MONTHLY_CAP = 20000;   // UGX — total airtime per member per calendar month
const AIRTIME_SMS_FEE = 200;         // UGX — flat two-way notification fee per request

async function sendSMS(toPhone, message) {
    if (!SMS_GATEWAY_KEY) {
        console.log("[SMS skipped — SMS_GATEWAY_KEY not set yet]", toPhone, message);
        return { ok: false, skipped: true, error: "SMS gateway not configured yet." };
    }
    try {
        const res = await fetch(SMS_GATEWAY_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": SMS_GATEWAY_KEY },
            body: JSON.stringify({ to: toPhone, message: message })
        });
        if (!res.ok) {
            return { ok: false, error: `Gateway responded with status ${res.status} — the phone or gateway may be offline.` };
        }
        return { ok: true };
    } catch (e) {
        return { ok: false, error: "Could not reach the SMS gateway — the phone may be offline or the gateway app closed." };
    }
}
// Shared helper so any failed send (not a "not configured yet" no-op, a real
// failure once the gateway IS configured) is recorded visibly, not just
// logged quietly to the browser console where nobody would see it.
function recordSmsFailure(currentDb, setDBFn, context, error) {
    const entry = { id: uid("SMSFAIL"), date: todayISO(), context, error };
    const nx = Object.assign({}, currentDb, { smsFailures: [entry, ...(currentDb.smsFailures || [])] });
    setDBFn(nx);
    saveDB(nx);
}

/* ============ INTEREST RULE ============
   More savings relative to loan = lower rate.
   Savings >= 2x Loan        -> 3%
   Loan < Savings < 2x Loan  -> 5%
   Savings <= Loan, > 2/3 Loan -> 10%
   Savings <= 2/3 Loan (or blank/zero) -> 15%
*/
function interestRate(loanAmount, savings) {
    const s = Number(savings) || 0;
    const l = Number(loanAmount) || 0;
    if (l <= 0)
        return 0;
    if (s <= 0)
        return 15;
    if (s >= 2 * l)
        return 3;
    if (s > l)
        return 5;
    if (s > (2 / 3) * l)
        return 10;
    return 15;
}
function fmt(n) {
    const v = Number(n) || 0;
    return "UGX " + v.toLocaleString('en-UG', { maximumFractionDigits: 0 });
}
// East Africa Time (EAT, UTC+3) — a fixed offset with no daylight saving
// observed. Every date/time calculation in this app goes through these
// functions so records, due dates, and reports stay consistent in EAT no
// matter what timezone the device or browser opening the app is set to.
const EAT_OFFSET_MS = 3 * 60 * 60 * 1000;
function nowInEAT() {
    return new Date(Date.now() + EAT_OFFSET_MS);
}
function todayISO() {
    return nowInEAT().toISOString().slice(0, 10);
}
function nowTimeEAT() {
    return nowInEAT().toISOString();
}
function addDays(dateStr, days) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + days);
    return dt.toISOString().slice(0, 10);
}
function addMonths(dateStr, months) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCMonth(dt.getUTCMonth() + months);
    return dt.toISOString().slice(0, 10);
}
function uid(prefix) {
    return prefix + "-" + Math.random().toString(36).slice(2, 8).toUpperCase();
}

/* ============ AUDIT LOG ============
   Every sensitive action (deletions, restores, loan issuance, repayments,
   airtime decisions) gets a permanent, timestamped entry here. This does not
   replace real access control — with a single shared Admin PIN, anyone using
   it is recorded simply as "Admin," not as a specific individual. What this
   DOES give: a visible record that something happened and when, so nothing
   destructive can vanish without a trace. */
function logAudit(db, action, details) {
    const entry = { id: uid("LOG"), date: todayISO(), time: nowTimeEAT(), action, details };
    return Object.assign({}, db, { auditLog: [entry, ...(db.auditLog || [])] });
}

function onSaveStatus(fn) { _saveListeners.push(fn); return () => { _saveListeners = _saveListeners.filter(f => f !== fn); }; }

/* Sheets (via Code.gs, pointed at a dedicated internal spreadsheet) is the
   authoritative store when configured. Claude's own storage is kept as a
   local CACHE only — updated every time Sheets is successfully reached, and
   used as a fallback display if Sheets is briefly unreachable, but never
   trusted as the source of truth once Sheets is available again.
   Uses the browser's own localStorage (not Claude's artifact storage,
   which only exists inside Claude and isn't available here). */
function cacheGet(key) {
    try {
        const v = localStorage.getItem(key);
